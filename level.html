<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="icon" type="image/png" href="assets/diffs/Grandmaster II.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="gmzCache.js"></script>
    <style>
        .page-container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .top-nav { margin-bottom: 20px; }
        .back-link { color: var(--accent); text-decoration: none; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
        .back-link:hover { color: #fff; }

        .layout-wrapper { display: flex; gap: 25px; }
        .level-card { flex: 2; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; position: relative; }
        .sidebar-card { flex: 0.8; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; height: fit-content; }
        
        .banner { height: 350px; background-size: cover; background-position: center; position: relative; border-bottom: 1px solid var(--border); background-color: #000; }
        .banner-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent, rgba(15, 23, 42, 1)); }
        .level-body { padding: 40px; position: relative; margin-top: -60px; }

        .section-label { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1.5px; margin-bottom: 15px; display: block; }
        
        .stat-list { display: flex; flex-direction: column; gap: 10px; margin-top: 30px; }
        .stat-row {
            background: rgba(255,255,255,0.02); 
            padding: 12px 20px;
            border-radius: 10px; 
            border: 1px solid var(--border); 
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }
        .stat-row:hover { background: rgba(255,255,255,0.05); transform: translateX(5px); }
        .stat-left { display: flex; align-items: center; gap: 15px; }
        .stat-icon-wrapper { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; }
        .stat-row-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; font-weight: 600; }
        .stat-row-value { font-size: 1.15rem; font-weight: 800; }

        .rank-bubble {
            background: var(--accent);
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 1.8rem;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .level-header-row { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .player-entry { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
        .player-pfp { width: 32px; height: 32px; border-radius: 4px; object-fit: cover; background: #222; border: 1px solid rgba(255,255,255,0.1); }
        .sidebar-divider { height: 1px; background: var(--border); margin: 20px 0; }
        .skill-tag { background: rgba(255,255,255,0.08); border: 1px solid var(--border); padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; display: inline-block; margin: 0 6px 6px 0; }
        
        .code-container { display: flex; gap: 8px; margin-top: 10px; max-width: 600px; }
        .code-input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid #444; color: #fff; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.9rem; }
        .action-btn { background: var(--accent); color: white; border: none; padding: 0 20px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; white-space: nowrap; height: 42px; }
        .action-btn:hover { opacity: 0.8; }


        .info-block { margin: 20px 0 0; padding: 18px 20px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 10px; }
        .info-block p { margin: 0; color: #eee; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
        .info-block.guidelines { border-left: 4px solid #f59e0b; }
        .info-block.guidelines .section-label { color: #f59e0b; }
        .info-block.notes { border-left: 4px solid #38bdf8; }
        .info-block.notes .section-label { color: #38bdf8; }
        .acronym-tag { display: inline-block; align-self: flex-start; margin-top: 6px; padding: 3px 10px; font-size: 0.8rem; font-weight: 800; letter-spacing: 1px; border-radius: 6px; background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: var(--text-muted); }
        .meta-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .meta-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; font-size: 0.78rem; font-weight: 700; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text-muted); text-decoration: none; }
        a.meta-chip:hover { color: #fff; border-color: var(--accent); }
        .resource-list { display: flex; flex-direction: column; gap: 8px; }
        .resource-link { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: #fff; text-decoration: none; font-weight: 600; font-size: 0.9rem; word-break: break-word; transition: 0.2s; }
        .resource-link:hover { border-color: var(--accent); background: rgba(255,255,255,0.08); }
        .resource-link i { color: var(--accent); width: 18px; text-align: center; }
        .resource-text { color: var(--text-muted); font-size: 0.9rem; white-space: pre-wrap; }
        .tas-box { display: flex; gap: 8px; margin-top: 10px; max-width: 600px; }

        @media (max-width: 900px) { .layout-wrapper { flex-direction: column; } }
    </style>
</head>
<body>
    <nav>
        <a href="index.html"><img src="assets/logo.webp" class="nav-logo" alt="Logo"></a>
    
        <div class="nav-links">
            <div class="dropdown">
                <button class="dropbtn">Lists <i class="fas fa-caret-down"></i></button>
                <div class="dropdown-content">
                    <a href="/mainlist"><i class="fas fa-list-ol"></i> Main List</a>

                    <a href="/leaderboard"><i class="fas fa-user"></i> Individual</a>

                </div>

            <div class="dropdown dropdown-right">
                <button class="dropbtn">Socials <i class="fas fa-caret-down"></i></button>
                <div class="dropdown-content">
                    <a href="https://discord.gg/H8QkgPEuKw" target="_blank"><i class="fab fa-discord"></i> Discord</a>
                </div>
            </div>

            <div class="dropdown dropdown-right">
                <button class="dropbtn">More <i class="fas fa-caret-down"></i></button>
                <div class="dropdown-content">
                    <a href="https://github.com/ProgramminguyFromScratch/GMZ" target="_blank"><i class="fab fa-github"></i> GitHub Repo</a>
                    <a href="/guidelines"><i class="fas fa-file-alt"></i> Submission Guidelines</a>
                    <a href="/submit"><i class="fa-solid fa-trophy"></i> Submit a Record</a>

    <div class="page-container">
        <div class="top-nav">
            <a href="/mainlist" id="back-btn" class="back-link">← Back</a>
        </div>

        <div id="loading-msg" style="text-align:center; margin-top:50px; font-weight:700; color:var(--text-muted);">
            Connecting...
        </div>

        <div class="layout-wrapper" id="page-content" style="display:none;">
            <div class="level-card">
                <div id="banner" class="banner"><div class="banner-overlay"></div></div>
                <div class="level-body">
                    <div id="main-details"></div>
                </div>
            </div>
            
            <div class="sidebar-card">
                <span class="section-label" id="sidebar-label-1">Verifier</span>
                <div id="verifier-area"></div>
                <div id="sidebar-rest">
                    <div class="sidebar-divider"></div>
                    <span class="section-label">Victors</span>
                    <div id="victors-area"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="levelRenderer.js"></script>
    <script src="levelPopup.js"></script>

    <script>
        const spreadsheetId = "10yZLCN80B0ExwiY8E5Y5GB95NV1T5UI69vLYywtg_J0";
        
        const GID_CONFIG = {
            'M': { gids: ["0", "1720349441"], backText: "← Back to Main List", backLink: "/mainlist" },
            'E': { gids: ["1575264256"], backText: "← Back to Extended List", backLink: "/expert" },
            'U': { gids: ["1899417734"], backText: "← Back to Unverified Zone", backLink: "/unverified" }
        };

        function getScoreColor(val) {
            const n = parseFloat(val) <= 10 ? parseFloat(val) * 10 : parseFloat(val);
            if (isNaN(n)) return 'var(--text-muted)';
            return `hsl(${n * 1.2}, 80%, 55%)`; 
        }

        function getEnjoymentIcon(val) {
            const n = parseFloat(val) <= 10 ? parseFloat(val) * 10 : parseFloat(val);
            if (n >= 95) return 'fa-face-grin-stars';
            if (n >= 85) return 'fa-face-grin-beam';
            if (n >= 75) return 'fa-face-smile-beam';
            if (n >= 60) return 'fa-face-smile';
            if (n >= 45) return 'fa-face-meh';
            if (n >= 30) return 'fa-face-frown';
            if (n >= 15) return 'fa-face-angry';
            return 'fa-face-dizzy';                    
        }


        function esc(str) {
            return String(str == null ? "" : str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }
        // true when a sheet cell has real content (blank / N/A / None don't count)
        function hasText(v) {
            const t = String(v == null ? "" : v).trim().toLowerCase();
            return t !== "" && t !== "n/a" && t !== "na" && t !== "none" && t !== "-";
        }
        function linkIcon(url) {
            if (/youtu\.?be/i.test(url)) return 'fa-brands fa-youtube';
            if (/discord/i.test(url)) return 'fa-brands fa-discord';
            if (/scratch\.mit\.edu/i.test(url)) return 'fa-solid fa-cat';
            if (/github/i.test(url)) return 'fa-brands fa-github';
            return 'fa-solid fa-link';
        }
        // Turns a multi-line cell into link buttons (for lines with URLs) + plain text lines.
        function resourcesHtml(raw) {
            const urlRe = /https?:\/\/[^\s"'<>]+/g;
            const out = [];
            String(raw).split(/\r?\n/).forEach(line => {
                line = line.trim();
                if (!line) return;
                const urls = line.match(urlRe);
                if (!urls) { out.push(`<div class="resource-text">${esc(line)}</div>`); return; }
                const label = line.replace(urlRe, '').replace(/[\s:\-–]+$/, '').trim();
                urls.forEach((u, i) => {
                    const text = label || (u.replace(/^https?:\/\/(www\.)?/, '').slice(0, 60));
                    out.push(`<a class="resource-link" href="${esc(u)}" target="_blank" rel="noopener noreferrer"><i class="${linkIcon(u)}"></i><span>${esc(urls.length > 1 ? text + ' ' + (i + 1) : text)}</span></a>`);
                });
            });
            return `<div class="resource-list">${out.join('')}</div>`;
        }
        function textBlock(cls, label, icon, value) {
            return `<div class="info-block ${cls}"><span class="section-label"><i class="fa-solid ${icon}"></i> ${label}</span><p>${esc(value)}</p></div>`;
        }

        async function init() {
            const params = new URLSearchParams(window.location.search);
            const targetId = params.get('id') || "";
            if (!targetId) { window.location.href = '/mainlist'; return; }

            const prefix = targetId.charAt(0).toUpperCase();
            const initialConfig = GID_CONFIG[prefix] || GID_CONFIG['M'];

            const backBtn = document.getElementById('back-btn');

            try {
                // Try the prefix-guessed sheet(s) first, then fall back to checking every other known sheet.
                const configsToTry = [initialConfig, ...Object.values(GID_CONFIG).filter(c => c !== initialConfig)];

                let lvl = null, matchedGid = null, matchedRowIndex = null, matchedConfig = null;

                for (const config of configsToTry) {
                    const results = await Promise.all(config.gids.map(gid => 
                        GMZCache.fetchCsvCached(GMZCache.sheetCsvUrl(spreadsheetId, gid))
                    ));

                    for (let g = 0; g < config.gids.length; g++) {
                        const idx = results[g].findIndex(row => String(Object.values(row)[0]).trim() === String(targetId).trim());
                        if (idx !== -1) {
                            lvl = results[g][idx];
                            matchedGid = config.gids[g];
                            matchedRowIndex = idx;
                            matchedConfig = config;
                            break;
                        }
                    }
                    if (lvl) break;
                }

                if (!lvl) {
                    backBtn.innerText = initialConfig.backText;
                    backBtn.href = initialConfig.backLink;
                    document.getElementById('loading-msg').innerHTML = "<h1>Level Not Found</h1>";
                    return;
                }

                backBtn.innerText = matchedConfig.backText;
                backBtn.href = matchedConfig.backLink;
                renderPage(lvl, targetId, prefix, matchedGid, matchedRowIndex, matchedConfig.backLink === '/unverified');
            } catch (err) {
                document.getElementById('loading-msg').innerHTML = "Database Connection Failed.";
            }
        }

        function renderPage(lvl, idValue, prefix, gid, rowIndex, isUnverified) {
            const getVal = (keys) => {
                const foundKey = Object.keys(lvl).find(k => keys.includes(k.trim()));
                return foundKey ? lvl[foundKey] : "";
            };

            const name = getVal(["Name", "name"]) || "Unknown";
            const rank = isUnverified ? (rowIndex + 1) : getVal(["Rank"]);
            const thumbCandidates = [
                `assets/thumbs/${encodeURIComponent(String(idValue).trim())}.jpg`,
                `assets/thumbs/cellImage_${gid}_${rowIndex}.jpg`,
                `assets/thumbs/Noimageavailable.png`
            ];
            const levelCode = (getVal(["Level Code"]) || "").trim();
            const enjoymentVal = getVal(["Enjoyment"]) || "0";
            const qualityVal = (getVal(["Quality"]) || "Basic").trim();
            const difficultyVal = (getVal(["Difficulty", "Estimated Difficulty"]) || "N/A").trim();
            const pointsVal = getVal(["Points"]) || "0";
            const acronym = (getVal(["Acronym"]) || "").trim();
            const numVal = (getVal(["Num"]) || "").trim();
            const projectForum = (getVal(["Project/Forum"]) || "").trim();
            const guidelines = getVal(["Guidelines for Completion"]) || "";
            const notes = getVal(["Notes"]) || "";
            const resources = getVal(["Helpful Resources"]) || "";
            const tasCreators = (getVal(["TAS Creators"]) || "").trim();
            const tasCode = (getVal(["TAS"]) || "").trim();
            const description = getVal(["Description"]) || "";

            document.title = `${name} | ID: ${idValue}`;
            (function loadBanner(i) {
                if (i >= thumbCandidates.length) return;
                const probe = new Image();
                probe.onload = () => { document.getElementById('banner').style.backgroundImage = `url('${thumbCandidates[i]}')`; };
                probe.onerror = () => loadBanner(i + 1);
                probe.src = thumbCandidates[i];
            })(0);
            document.getElementById('loading-msg').style.display = 'none';
            document.getElementById('page-content').style.display = 'flex';

            const verifier = (getVal(["Verifier"]) || "").trim();
            const victorsRaw = getVal(["Victors"]) || "";
            const otherVictors = victorsRaw.split(/[ ,]+/).filter(v => v && v.toLowerCase() !== "none" && v.toLowerCase() !== verifier.toLowerCase());
            const playerHtml = (n, strong) => `<div class="player-entry"><img src="assets/players/${esc(n)}.png" onerror="this.src='assets/players/default.png'" class="player-pfp">${strong ? `<strong>${esc(n)}</strong>` : `<span>${esc(n)}</span>`}</div>`;

            if (isUnverified) {
                // Unverified levels have no verifier/victors; show the TAS creators instead.
                document.getElementById('sidebar-label-1').textContent = 'TAS Creators';
                document.getElementById('sidebar-rest').style.display = 'none';
                const tasPeople = tasCreators.split(/[ ,]+/).filter(v => hasText(v));
                document.getElementById('verifier-area').innerHTML = tasPeople.length
                    ? tasPeople.map(v => playerHtml(v, true)).join("")
                    : `<p style="color:var(--text-muted);">None</p>`;
            } else {
                document.getElementById('verifier-area').innerHTML = (verifier && verifier.toLowerCase() !== "none")
                    ? playerHtml(verifier, true)
                    : `<p style="color:var(--text-muted);">None</p>`;
                document.getElementById('victors-area').innerHTML = otherVictors.length > 0
                    ? otherVictors.map(v => playerHtml(v.trim(), false)).join("")
                    : `<p style="color:var(--text-muted);">None</p>`;
            }

            const skillsRaw = getVal(["Skills Needed", "Skills"]);
            const skillsHtml = skillsRaw ? skillsRaw.split(',').map(s => `<span class="skill-tag">${s.trim()}</span>`).join('') : "N/A";

            const rankHtml = ((prefix === 'M' || isUnverified) && rank) ? `<span class="rank-bubble">#${rank}</span>` : "";

            const enjoymentRowHtml = isUnverified ? "" : `
                    <div class="stat-row">
                        <div class="stat-left">
                            <div class="stat-icon-wrapper"><i class="fa-solid ${getEnjoymentIcon(enjoymentVal)}" style="color:${getScoreColor(enjoymentVal)}"></i></div>
                            <span class="stat-row-label">Enjoyment</span>
                        </div>
                        <div class="stat-row-value" style="color:${getScoreColor(enjoymentVal)}">${enjoymentVal}</div>
                    </div>`;

            const pointsRowHtml = isUnverified ? "" : `
                    <div class="stat-row">
                        <div class="stat-left">
                            <div class="stat-icon-wrapper"><i class="fa-solid fa-bolt" style="color:var(--accent)"></i></div>
                            <span class="stat-row-label">Points</span>
                        </div>
                        <div class="stat-row-value" style="color:var(--accent)">${pointsVal}</div>
                    </div>`;

            const skillsSectionHtml = isUnverified ? "" : `
                <div style="margin-top:40px; border-top: 1px solid var(--border); padding-top:20px;">
                    <span class="section-label">Skills Required</span>
                    <div style="margin-top:10px;">${skillsHtml}</div>
                </div>`;

            const chips = [];
            if (numVal && hasText(numVal)) chips.push(`<span class="meta-chip"><i class="fa-solid fa-hashtag"></i> Entry ${esc(numVal)}</span>`);
            if (hasText(projectForum)) {
                chips.push(/^https?:\/\//i.test(projectForum)
                    ? `<a class="meta-chip" href="${esc(projectForum)}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-folder-open"></i> Project / Forum</a>`
                    : `<span class="meta-chip"><i class="fa-solid fa-folder-open"></i> ${esc(projectForum)}</span>`);
            }
            if (isUnverified && hasText(tasCreators)) chips.push(`<span class="meta-chip"><i class="fa-solid fa-robot"></i> TAS by ${esc(tasCreators)}</span>`);
            const chipsHtml = chips.length ? `<div class="meta-chips">${chips.join('')}</div>` : "";

            const resourcesSectionHtml = hasText(resources) ? `
                <div style="margin-top:40px; border-top: 1px solid var(--border); padding-top:20px;">
                    <span class="section-label">Helpful Resources</span>
                    ${resourcesHtml(resources)}
                </div>` : "";

            const tasSectionHtml = (isUnverified && hasText(tasCode)) ? `
                <div style="margin-top:40px; border-top: 1px solid var(--border); padding-top:20px;">
                    <span class="section-label">TAS</span>
                    <div class="tas-box">
                        <input type="text" value="${esc(tasCode)}" readonly class="code-input">
                        <button onclick="copyLevelCode(this, document.getElementById('tas-code-store').value)" class="action-btn">Copy</button>
                        <input type="hidden" id="tas-code-store" value="${esc(tasCode)}">
                    </div>
                </div>` : "";

            document.getElementById('main-details').innerHTML = `
                <div class="level-header-row">
                    ${rankHtml}
                    <div style="display: flex; flex-direction: column;">
                        <h1 style="font-size:3rem; font-weight:900; margin:0; line-height: 1.1;">${name}</h1>
                        <span style="color: rgba(255,255,255,0.5); font-size: 1.6rem; font-family: monospace; font-weight: 700; margin-top: 5px;">ID: ${esc(idValue)}</span>
                        ${hasText(acronym) ? `<span class="acronym-tag">${esc(acronym)}</span>` : ""}
                    </div>
                </div>
                <p style="color:var(--text-muted); font-size:1.2rem; margin-top:15px;">by <strong>${esc(getVal(["Creator(s)", "Author"]))}</strong></p>
                ${chipsHtml}

                <div style="margin:30px 0 0; padding:20px; background:rgba(0,0,0,0.2); border:1px solid var(--border); border-radius:10px;">
                    <span class="section-label" style="color:var(--accent)">Description</span>
                    <p style="margin:0; color:#eee; white-space:pre-wrap; word-break:break-word;">${hasText(description) ? esc(description) : "No description provided."}</p>
                </div>
                ${hasText(guidelines) ? textBlock('guidelines', 'Guidelines for Completion', 'fa-clipboard-check', guidelines) : ""}
                ${hasText(notes) ? textBlock('notes', 'Notes', 'fa-note-sticky', notes) : ""}

                <div class="stat-list">
                    <div class="stat-row">
                        <div class="stat-left">
                            <div class="stat-icon-wrapper"><img src="assets/diffs/${difficultyVal}.png" style="height:25px;"></div>
                            <span class="stat-row-label">Difficulty</span>
                        </div>
                        <div class="stat-row-value">${difficultyVal}</div>
                    </div>${enjoymentRowHtml}
                    <div class="stat-row">
                        <div class="stat-left">
                            <div class="stat-icon-wrapper">
                                <img src="assets/quality/${qualityVal}.svg" style="height:25px;" onerror="this.style.display='none'">
                            </div>
                            <span class="stat-row-label">Quality</span>
                        </div>
                        <div class="stat-row-value">${qualityVal}</div>
                    </div>${pointsRowHtml}
                </div>
                ${skillsSectionHtml}

                <div style="margin-top:40px; border-top: 1px solid var(--border); padding-top:20px;">
                    <span class="section-label">Level Details</span>
                    <div class="code-container">
                        <input type="text" value="${esc(levelCode)}" readonly class="code-input">
                        <button onclick="copyLevelCode(this, \`${levelCode.replace(/'/g, "\\'")}\`)" class="action-btn">Copy</button>
                        <button onclick="LevelPopup.show(\`${levelCode.replace(/'/g, "\\'")}\`)" class="action-btn">Preview</button>
                    </div>
                </div>
                ${tasSectionHtml}
                ${resourcesSectionHtml}
            `;
        }

        function copyLevelCode(btn, code) {
            navigator.clipboard.writeText(code).then(() => {
                const orig = btn.textContent;
                btn.textContent = "Copied!";
                setTimeout(() => btn.textContent = orig, 1500);
            });
        }

        window.onload = init;
    </script>
